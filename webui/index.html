<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>nobg - Remove Background</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <style>
            main {
                max-width: 900px;
                padding-top: 2rem;
            }
            .upload-area {
                border: 2px dashed var(--pico-muted-border-color);
                border-radius: var(--pico-border-radius);
                padding: 2rem;
                text-align: center;
                cursor: pointer;
                margin-bottom: 1rem;
            }
            .upload-area:hover {
                border-color: var(--pico-primary);
            }
            .upload-area.dragover {
                border-color: var(--pico-primary);
                background-color: var(--pico-primary-background);
            }
            #preview-container {
                display: none;
                margin: 1rem 0;
            }
            #preview-container img,
            #result-wrapper img {
                max-width: 100%;
                max-height: 350px;
                border-radius: var(--pico-border-radius);
            }
            .side-by-side {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
                margin: 1rem 0;
            }
            .side-by-side > div {
                text-align: center;
            }
            .img-wrapper {
                display: inline-block;
                background-color: #fff; /* Base color (white) */
                background: repeating-conic-gradient(#fff 0 25%, #999 0 50%)
                    50% / 20px 20px;
                background-position:
                    0 0,
                    8px 8px;
                padding: 8px;
                border-radius: var(--pico-border-radius);
            }
            .img-wrapper img {
                display: block;
            }
            .loading {
                display: none;
                text-align: center;
                margin: 1rem 0;
            }
            .error {
                color: var(--pico-del-color);
                display: none;
                margin: 1rem 0;
            }
            .btn-row {
                display: flex;
                gap: 1rem;
                margin-top: 1rem;
            }
        </style>
    </head>
    <body>
        <main class="container">
            <h1>nobg</h1>
            <p>Remove background from images using local AI</p>

            <div class="upload-area" id="upload-area">
                <p>Drop an image here or click to upload</p>
                <input type="file" id="file-input" accept="image/*" hidden />
            </div>

            <label for="model-select">Model</label>
            <select id="model-select">
                <option value="" disabled selected>Loading models...</option>
            </select>

            <div id="preview-container">
                <div class="side-by-side">
                    <div>
                        <h3>Original</h3>
                        <div class="img-wrapper">
                            <img id="preview-image" src="" alt="Preview" />
                        </div>
                    </div>
                    <div id="result-wrapper" style="display: none">
                        <h3>Result</h3>
                        <div class="img-wrapper">
                            <img id="result-image" src="" alt="Result" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <progress></progress>
                <p>Processing image...</p>
            </div>

            <div id="process-btn-container" style="display: none">
                <button id="process-btn">Remove Background</button>
            </div>

            <div class="error" id="error"></div>

            <div id="result-buttons" style="display: none" class="btn-row">
                <a
                    id="download-btn"
                    href="#"
                    download="result.png"
                    role="button"
                    class="outline"
                    >Download</a
                >
                <button id="reset-btn" class="secondary">Reset</button>
            </div>
        </main>

        <script src="script.js"></script>
    </body>
</html>
