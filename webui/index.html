<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>nobg - Remove Background</title>
        <link rel="stylesheet" href="pico.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="container">
            <h1>nobg</h1>
            <p>Remove background from images using local AI</p>

            <div class="upload-area" id="upload-area">
                <p>Drop an image here or click to upload</p>
                <input type="file" id="file-input" accept="image/*" hidden />
            </div>

            <label for="model-select">Model</label>
            <select id="model-select">
                <option value="" disabled selected>Loading models...</option>
            </select>

            <div id="preview-container">
                <div class="side-by-side">
                    <div>
                        <h3>Original</h3>
                        <div class="img-wrapper">
                            <img id="preview-image" src="" alt="Preview" />
                        </div>
                    </div>
                    <div id="result-wrapper" style="display: none">
                        <h3>Result</h3>
                        <div class="img-wrapper">
                            <img id="result-image" src="" alt="Result" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <progress></progress>
                <p>Processing image...</p>
            </div>

            <div id="process-btn-container" style="display: none">
                <button id="process-btn">Remove Background</button>
            </div>

            <div class="error" id="error"></div>

            <div id="result-buttons" style="display: none" class="btn-row">
                <a
                    id="download-btn"
                    href="#"
                    download="result.png"
                    role="button"
                    class="outline"
                    >Download</a
                >
                <button id="reset-btn" class="secondary">Reset</button>
            </div>
        </main>

        <script src="script.js"></script>
    </body>
</html>
